# Checks run on every branch push and pull request: clean install, migrations, types, lint, tests, production build.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

# A newer run for the same branch (or pull request) cancels the one still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must satisfy "engines" in package.json (Vite 7, used by Vitest, needs Node 20.19+ or 22.12+).
          node-version: 22
          cache: npm

      - run: npm ci
      # The migrations folder (drizzle/): snapshots chained, no two migrations at the same place. That the schema has its
      # migration, and that the chain gives its structure, is tested by tests/integration/migrations.test.ts.
      - run: npm run db:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Inter is served from the repository (src/fonts, next/font/local): the build needs no network.
      - run: npm run build
