# Checks run on every branch push and pull request: clean install, types, lint, tests, production build.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

# A newer run for the same branch (or pull request) cancels the one still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must satisfy "engines" in package.json (Vite 7, used by Vitest, needs Node 20.19+ or 22.12+).
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Downloads the Inter font from Google Fonts (next/font/google): needs network access, available on GitHub runners.
      - run: npm run build
